<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>114五下數學CH8駕駛艙</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="drawLayer" aria-hidden="true"></canvas>
  <div id="laserLayer" aria-hidden="true"><span id="laserDot"></span></div>
  <div id="bigEffect" aria-live="polite"></div>

  <a class="home-link" href="../國小數學/" aria-label="回國小數學首頁">首頁</a>

  <nav class="focus-nav" aria-label="教學焦點">
    <button class="focus-btn active" data-focus="0">認識比率</button>
    <button class="focus-btn" data-focus="1">認識百分率</button>
    <button class="focus-btn" data-focus="2">分數小數百分率互換</button>
    <button class="focus-btn" data-focus="3">百分率應用</button>
    <button class="focus-btn" data-focus="4">折扣與加成</button>
  </nav>

  <main class="dashboard">
    <section class="lesson-head">
      <p id="focusLabel" class="eyebrow">教學焦點 1</p>
      <h1 id="focusTitle">認識比率</h1>
      <p id="focusGoal">用部分量與全體量建立比率概念。</p>
    </section>

    <section class="panel visual-panel">
      <div class="panel-title">
        <h2>互動視覺化</h2>
        <span id="visualHint">拖動或調整數值，連結圖像與算式</span>
      </div>
      <div id="visualStage" class="visual-stage"></div>
      <div id="visualControls" class="visual-controls"></div>
    </section>

    <section class="panel practice-panel">
      <div class="panel-title">
        <h2>操作練習</h2>
        <span id="practiceCaption">全班一起操作</span>
      </div>
      <div id="practiceBody" class="practice-body"></div>
    </section>

    <section class="panel quiz-panel">
      <div class="panel-title">
        <h2>形成性評量</h2>
        <span id="quizStatus">第 1 / 5 題</span>
      </div>
      <p id="quizType" class="quiz-type"></p>
      <p id="quizQuestion" class="quiz-question"></p>
      <div id="quizAnswerArea" class="quiz-answer-area"></div>
      <div id="quizFeedback" class="quiz-feedback" aria-live="polite"></div>
      <div class="quiz-actions">
        <button id="prevQuiz" type="button">上一題</button>
        <button id="resetQuiz" type="button">重新開始</button>
        <button id="nextQuiz" type="button">下一題</button>
      </div>
    </section>

    <section class="panel summary-panel">
      <div class="panel-title">
        <h2>重點整理</h2>
        <a id="notebookDownload" href="notebooklm-export.md" target="_blank" rel="noreferrer">NotebookLM資料</a>
      </div>
      <div class="summary-layout">
        <img id="summaryImage" src="assets/deck-page-01.svg" alt="比率重點整理">
        <div id="summaryBullets" class="summary-bullets"></div>
      </div>
    </section>
  </main>

  <div class="floating-actions" aria-label="浮動工具">
    <button id="openPen" class="round-tool" aria-label="畫筆工具">✎</button>
    <button id="openLaser" class="round-tool" aria-label="雷射筆">●</button>
    <button id="openTools" class="round-tool" aria-label="工具箱">☰</button>
    <button id="openNotebook" class="round-tool" aria-label="NotebookLM輸出">N</button>
  </div>

  <aside id="penDrawer" class="drawer pen-drawer" aria-label="畫筆工具">
    <div class="drawer-head">
      <h2>畫筆</h2>
      <button class="close-drawer" data-close="penDrawer" aria-label="關閉畫筆面板">×</button>
    </div>
    <div class="pen-row" aria-label="畫筆顏色">
      <button class="pen-color active" data-color="#ffffff" style="--swatch:#ffffff" aria-label="白色畫筆"></button>
      <button class="pen-color" data-color="#ffe36f" style="--swatch:#ffe36f" aria-label="黃色畫筆"></button>
      <button class="pen-color" data-color="#ff5b5b" style="--swatch:#ff5b5b" aria-label="紅色畫筆"></button>
      <button class="pen-color" data-color="#9ee6ff" style="--swatch:#9ee6ff" aria-label="藍色畫筆"></button>
      <button class="pen-color" data-color="#69d48f" style="--swatch:#69d48f" aria-label="綠色畫筆"></button>
    </div>
    <label class="control">畫筆粗細
      <input id="penSize" type="range" min="3" max="26" value="8">
    </label>
    <button id="clearInk" type="button">清除筆跡</button>
    <button id="closePenMode" type="button">關閉畫筆</button>
  </aside>

  <aside id="laserDrawer" class="drawer pen-drawer" aria-label="雷射筆工具">
    <div class="drawer-head">
      <h2>雷射筆</h2>
      <button class="close-drawer" data-close="laserDrawer" aria-label="關閉雷射筆面板">×</button>
    </div>
    <label class="control">雷射點大小
      <input id="laserSize" type="range" min="24" max="110" value="54">
    </label>
    <button id="laserToggle" type="button">開啟雷射筆</button>
  </aside>

  <aside id="toolDrawer" class="drawer tool-drawer" aria-label="教師工具箱">
    <div class="drawer-head">
      <h2>工具箱</h2>
      <button class="close-drawer" data-close="toolDrawer" aria-label="關閉工具箱">×</button>
    </div>
    <section>
      <h2>抽籤</h2>
      <div class="range-row">
        <label>從 <input id="rangeStart" type="number" value="1" min="1"></label>
        <label>到 <input id="rangeEnd" type="number" value="30" min="1"></label>
        <button id="buildNames" type="button">產生名單</button>
      </div>
      <textarea id="namesInput" rows="6" aria-label="抽籤名單"></textarea>
      <button id="drawName" type="button">抽一位</button>
      <p id="drawResult" class="tool-result">等待抽籤</p>
    </section>
    <section>
      <h2>計時器</h2>
      <div class="timer-row">
        <button type="button" data-sec="30">30秒</button>
        <button type="button" data-sec="60">1分</button>
        <button type="button" data-sec="120">2分</button>
        <button type="button" data-sec="300">5分</button>
      </div>
      <div id="timerDisplay" class="timer" aria-live="polite">00:00</div>
      <button id="timerToggle" type="button">開始</button>
      <button id="timerReset" type="button">歸零</button>
      <div class="custom-time">
        <label class="control">其他時間（分鐘）
          <input id="customMinutes" type="number" min="1" max="60" value="10">
        </label>
        <button id="setCustomTime" type="button">設定</button>
      </div>
    </section>
  </aside>

  <aside id="notebookDrawer" class="drawer notebook-drawer" aria-label="NotebookLM輸出專區">
    <div class="drawer-head">
      <h2>NotebookLM輸出專區</h2>
      <button class="close-drawer" data-close="notebookDrawer" aria-label="關閉NotebookLM輸出">×</button>
    </div>
    <p class="drawer-note">iframe 會受 NotebookLM 與瀏覽器 CSP / 第三方登入限制阻擋，因此改用 markdown 檔與新分頁開啟。</p>
    <button id="copyNotebook" type="button">複製本焦點資料</button>
    <button id="openNotebookLM" type="button">開啟 NotebookLM</button>
    <a class="drawer-link" href="notebooklm-export.md" target="_blank" rel="noreferrer">開啟 notebooklm-export.md</a>
    <h3>影片生成資料</h3>
    <pre id="videoScriptData"></pre>
    <h3>簡報生成資料</h3>
    <pre id="slideData"></pre>
  </aside>

  <script src="script.js"></script>
</body>
</html>
