<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#fbfcf9"/>
  <text x="64" y="88" font-size="54" font-family="Microsoft JhengHei, sans-serif" font-weight="800" fill="#20302a">百分率的應用</text>
  <text x="64" y="142" font-size="26" font-family="Microsoft JhengHei, sans-serif" fill="#60706a">先判斷題目要求部分量，還是要求百分率</text>
  <rect x="64" y="210" width="380" height="170" rx="16" fill="#eef7f2"/>
  <text x="94" y="270" font-size="34" font-family="Microsoft JhengHei, sans-serif" font-weight="800" fill="#20302a">求部分量</text>
  <text x="94" y="330" font-size="42" font-family="Microsoft JhengHei, sans-serif" fill="#0f7f8c">整體量 × 百分率</text>
  <rect x="516" y="210" width="380" height="170" rx="16" fill="#fff7e9"/>
  <text x="546" y="270" font-size="34" font-family="Microsoft JhengHei, sans-serif" font-weight="800" fill="#20302a">求百分率</text>
  <text x="546" y="330" font-size="42" font-family="Microsoft JhengHei, sans-serif" fill="#b87918">部分量 ÷ 整體量</text>
  <text x="64" y="462" font-size="28" font-family="Microsoft JhengHei, sans-serif" fill="#60706a">例：25 題答對率 96%，答對 25 × 96% = 24 題。</text>
</svg>
