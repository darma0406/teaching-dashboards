<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教學駕駛艙總覽</title>
  <style>
    :root {
      --board: #103b31;
      --board-dark: #082920;
      --chalk: #fff7d6;
      --muted: #dcebdd;
      --yellow: #ffe36f;
      --blue: #9ee6ff;
      --line: rgba(255, 247, 214, .35);
      --panel: rgba(8, 42, 34, .78);
      --shadow: rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--chalk);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.08), transparent 30%),
        linear-gradient(135deg, var(--board), var(--board-dark));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 54px 54px;
    }

    main {
      position: relative;
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 20px;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--chalk);
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .intro {
      max-width: 820px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: clamp(20px, 2.2vw, 28px);
      line-height: 1.45;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .dashboard-card {
      display: grid;
      gap: 12px;
      min-height: 220px;
      padding: 22px;
      border: 2px solid var(--line);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      box-shadow: 0 12px 26px var(--shadow);
    }

    .dashboard-card:hover {
      border-color: var(--yellow);
      background: rgba(255, 227, 111, .11);
    }

    .card-meta {
      color: var(--blue);
      font-size: 18px;
    }

    .dashboard-card h2 {
      margin: 0;
      color: var(--yellow);
      font-size: clamp(28px, 3.3vw, 40px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .dashboard-card p {
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.4;
    }

    .card-action {
      align-self: end;
      color: var(--chalk);
      font-size: 20px;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 28px, 1120px);
        padding-top: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">114 學年度教學工具</p>
    <h1>教學駕駛艙總覽</h1>
    <p class="intro">這裡會統一管理可公開使用的課堂互動駕駛艙。未來新增的單元會放在同一個首頁，學生與老師都可以直接開啟使用。</p>

    <section class="dashboard-grid" aria-label="駕駛艙清單">
      <a class="dashboard-card" href="./康軒五下第七單元-表面積/">
        <span class="card-meta">國小數學 5 下 第 07 單元</span>
        <h2>表面積教學駕駛艙</h2>
        <p>包含學生自學影片、互動視覺化、形成性評量、重點整理、抽籤、計時器與畫筆工具。</p>
        <span class="card-action">開啟駕駛艙</span>
      </a>
    </section>
  </main>
</body>
</html>
